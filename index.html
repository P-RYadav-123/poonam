<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; margin: 0; font-family: sans-serif; }
    .calc { background: #1e293b; padding: 20px; border-radius: 12px; width: 260px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    #display { width: 100%; height: 48px; background: #0f172a; color: #38bdf8; font-size: 24px; border: none; text-align: right; padding: 8px; box-sizing: border-box; margin-bottom: 15px; border-radius: 6px; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { padding: 14px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; background: #334155; color: white; }
    button:hover { background: #475569; }
    button.op { background: #2563eb; }
    button.clear { background: #dc2626; }
    button.equal { background: #16a34a; grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calc">
    <input type="text" id="display" readonly>
    <div class="keys">
      <button class="clear" onclick="document.getElementById('display').value=''">C</button>
      <button class="op" onclick="document.getElementById('display').value+='/'">/</button>
      <button class="op" onclick="document.getElementById('display').value+='*'">*</button>
      <button class="op" onclick="document.getElementById('display').value+='-'">-</button>
      <button onclick="document.getElementById('display').value+='7'">7</button>
      <button onclick="document.getElementById('display').value+='8'">8</button>
      <button onclick="document.getElementById('display').value+='9'">9</button>
      <button class="op" onclick="document.getElementById('display').value+='+'">+</button>
      <button onclick="document.getElementById('display').value+='4'">4</button>
      <button onclick="document.getElementById('display').value+='5'">5</button>
      <button onclick="document.getElementById('display').value+='6'">6</button>
      <button class="equal" onclick="try{document.getElementById('display').value=eval(document.getElementById('display').value)}catch(e){document.getElementById('display').value='Error'}">=</button>
      <button onclick="document.getElementById('display').value+='1'">1</button>
      <button onclick="document.getElementById('display').value+='2'">2</button>
      <button onclick="document.getElementById('display').value+='3'">3</button>
      <button onclick="document.getElementById('display').value+='0'">0</button>
    </div>
  </div>
</body>
</html>
